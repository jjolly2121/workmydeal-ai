spring.datasource.url=${WORKMYDEAL_DB_URL:jdbc:postgresql://localhost:5432/workmydeal}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${WORKMYDEAL_DB_USERNAME:workmydeal}
spring.datasource.password=${WORKMYDEAL_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

workmydeal.demo.enabled=true
workmydeal.demo.reset-on-start=false
